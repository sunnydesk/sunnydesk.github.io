<title>Sunny Hub — Premium</title>
<style>
:root{
 --bg:#070b18;--panel:#0d1427;--panel2:#121b33;--text:#f8fafc;--muted:#9aa7c2;
 --line:rgba(255,255,255,.09);--blue:#4f7cff;--cyan:#33d6ff;--green:#21d58b;
 --red:#ff3358;--shadow:0 24px 70px rgba(0,0,0,.35)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:
 radial-gradient(circle at 10% 0%,#142657 0,transparent 28%),radial-gradient(circle at 100% 20%,#24164d 0,transparent 30%),var(--bg);
 color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden}
body.light{--bg:#f4f7fb;--panel:#fff;--panel2:#eef3ff;--text:#101828;--muted:#667085;--line:#e4e7ec;background:#f4f7fb}
button,input{font:inherit}a{text-decoration:none;color:inherit}.hidden{display:none!important}
.container{width:min(1180px,100%);margin:auto;padding:0 18px}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;background:#050816;display:grid;place-items:center;overflow:hidden}
.intro-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(79,124,255,.28),transparent 65%);filter:blur(12px);animation:glow 2.5s ease-in-out infinite alternate}
.intro-logo{position:relative;text-align:center;animation:introIn 1.1s cubic-bezier(.16,1,.3,1) both}
.logo-ring{width:104px;height:104px;margin:auto;border-radius:32px;display:grid;place-items:center;font-size:46px;font-weight:1000;
 background:linear-gradient(135deg,#4f7cff,#8a5cff);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 25px 80px rgba(79,124,255,.45);animation:logoPop 1.4s .15s both}
.intro-logo h1{font-size:34px;letter-spacing:5px;margin:24px 0 4px}.intro-logo p{margin:0;color:#8290b1;font-size:11px;letter-spacing:3px;font-weight:800}
.loader-line{width:180px;height:3px;background:#18223b;border-radius:99px;margin:28px auto 0;overflow:hidden}
.loader-line i{display:block;width:45%;height:100%;background:linear-gradient(90deg,#4f7cff,#33d6ff);border-radius:99px;animation:load 1.5s ease-in-out infinite}
@keyframes introIn{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
@keyframes logoPop{from{transform:scale(.3) rotate(-12deg);opacity:0}70%{transform:scale(1.08) rotate(3deg)}to{transform:scale(1)}}
@keyframes glow{to{transform:scale(1.25);opacity:.65}}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(400%)}}
#intro.hide{animation:introOut .7s ease forwards}@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.03)}}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(7,11,24,.72);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.light header{background:rgba(255,255,255,.78)}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:1000;letter-spacing:1px}.brand-logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#4f7cff,#8a5cff);box-shadow:0 9px 25px rgba(79,124,255,.28)}
.brand small{display:block;font-size:8px;letter-spacing:2px;color:var(--muted);margin-top:2px}
.nav-actions{display:flex;gap:8px}.round{width:42px;height:42px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;cursor:pointer;transition:.25s}.round:hover{transform:translateY(-2px);border-color:rgba(79,124,255,.5)}

/* DRAWER */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:180;opacity:0;visibility:hidden;transition:.3s}.scrim.show{opacity:1;visibility:visible}
.drawer{position:fixed;z-index:200;left:0;top:0;bottom:0;width:min(350px,88vw);background:linear-gradient(180deg,#0b1122,#080d19);border-right:1px solid rgba(255,255,255,.08);transform:translateX(-105%);transition:.4s cubic-bezier(.16,1,.3,1);padding:22px;box-shadow:30px 0 80px rgba(0,0,0,.35)}
.drawer.show{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.drawer-brand{font-weight:1000;font-size:20px}.drawer-brand span{color:#668cff}.drawer a,.drawer button{display:flex;width:100%;align-items:center;gap:13px;padding:15px;border:0;border-radius:15px;background:transparent;color:#dce5ff;text-align:left;cursor:pointer;margin:4px 0;font-weight:750}.drawer a:hover,.drawer button:hover{background:rgba(255,255,255,.06)}.drawer .active{background:linear-gradient(90deg,rgba(79,124,255,.2),transparent);color:#fff}.drawer-note{margin-top:25px;padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(255,255,255,.03);font-size:12px;color:#8795b3;line-height:1.6}

/* HERO */
.hero{padding:42px 0 18px}.hero-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
.hero-main{min-height:390px;border:1px solid rgba(255,255,255,.09);border-radius:34px;padding:38px;position:relative;overflow:hidden;
 background:linear-gradient(135deg,#101e48 0%,#274cc2 52%,#6b45d9 100%);box-shadow:var(--shadow);isolation:isolate}
.hero-main:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-90px;top:-130px;background:rgba(255,255,255,.1);z-index:-1;animation:float 8s ease-in-out infinite alternate}
.hero-main:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;left:-100px;bottom:-120px;background:rgba(51,214,255,.12);filter:blur(2px);z-index:-1}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:8px 11px;border-radius:99px;background:rgba(255,255,255,.1);font-size:10px;font-weight:900;letter-spacing:1.5px}.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 5px rgba(74,222,128,.12)}
.hero h1{font-size:clamp(40px,6vw,70px);line-height:.94;letter-spacing:-3px;margin:22px 0 17px}.hero p{color:rgba(255,255,255,.78);line-height:1.7;max-width:600px;margin:0;font-size:15px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.btn{padding:13px 17px;border-radius:14px;border:1px solid rgba(255,255,255,.14);font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.25s}.btn.primary{background:#fff;color:#14265f}.btn.glass{background:rgba(255,255,255,.1);color:#fff}.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.15)}
.hero-side{border:1px solid var(--line);border-radius:34px;background:var(--panel);padding:23px;box-shadow:var(--shadow)}
.profile{display:flex;gap:13px;align-items:center}.avatar{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#4f7cff,#8a5cff);font-size:25px;font-weight:1000}.profile b{font-size:17px}.profile span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:22px}.mini{padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel2)}.mini b{font-size:22px}.mini span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.quote{margin-top:10px;padding:15px;border-radius:18px;background:linear-gradient(135deg,rgba(79,124,255,.12),rgba(138,92,255,.08));font-size:12px;color:var(--muted);line-height:1.6}

/* TOOLBAR */
.toolbar{display:flex;gap:10px;margin:22px 0}.search{flex:1;display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);background:var(--panel);border-radius:16px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}.filter{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:0 13px;outline:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:25px}.tab{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:900;cursor:pointer}.tab.active{background:linear-gradient(135deg,#4f7cff,#5c55e8);color:#fff;border-color:transparent;box-shadow:0 12px 30px rgba(79,124,255,.2)}

/* SECTION */
.section-head{display:flex;align-items:end;justify-content:space-between;margin:28px 0 13px}.section-head h2{margin:0;font-size:23px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:17px;box-shadow:0 15px 45px rgba(0,0,0,.12);transition:.28s;animation:cardIn .65s both}.card:hover{transform:translateY(-6px);box-shadow:0 25px 60px rgba(0,0,0,.22)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card-top{display:flex;align-items:center;gap:12px}.app-icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:26px;font-weight:1000;box-shadow:inset 0 1px rgba(255,255,255,.2);transition:.3s}.card:hover .app-icon{transform:rotate(-4deg) scale(1.06)}.blue{background:linear-gradient(135deg,#2f6fff,#564de8)}.red{background:linear-gradient(135deg,#ff1744,#b90031)}.green{background:linear-gradient(135deg,#10b981,#047857)}.orange{background:linear-gradient(135deg,#f59e0b,#ef4444)}.card h3{margin:0;font-size:16px}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.preview{height:170px;margin:15px 0;border-radius:20px;padding:21px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative}.preview:after{content:"";position:absolute;inset:-80% -40%;background:linear-gradient(100deg,transparent 45%,rgba(255,255,255,.16) 50%,transparent 55%);transform:translateX(-35%) rotate(8deg);transition:.9s}.card:hover .preview:after{transform:translateX(35%) rotate(8deg)}
.pblue{background:linear-gradient(135deg,#12255d,#315ee9,#32b6ff)}.pred{background:linear-gradient(135deg,#47000f,#e30035,#ff5271)}.pgreen{background:linear-gradient(135deg,#064e3b,#059669,#2dd4bf)}.porange{background:linear-gradient(135deg,#6b2d00,#e85d04,#ffb703)}
.preview .small{font-size:10px;font-weight:900;letter-spacing:1.3px;opacity:.75}.preview .big{font-size:27px;font-weight:1000;line-height:1.03;margin-top:7px}.play{width:88px;height:62px;border-radius:19px;background:#fff;color:#e0002b;display:grid;place-items:center;font-size:25px;box-shadow:0 14px 35px rgba(0,0,0,.15);z-index:2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}.tag{font-size:10px;font-weight:900;padding:6px 9px;border-radius:99px;background:var(--panel2);color:#6b7bb5}.tag.ok{background:rgba(33,213,139,.12);color:#22d391}.desc{font-size:12px;color:var(--muted);line-height:1.65;margin:0 0 13px}.actions{display:grid;grid-template-columns:1fr;gap:8px}.action{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:11px;font-weight:850;text-align:center;cursor:pointer;transition:.2s}.action:hover{transform:translateY(-2px)}.action.primary{background:var(--blue);color:#fff;border-color:transparent}

/* CLASS SELECTION */
.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.class-card{position:relative;overflow:hidden;padding:26px 22px;border-radius:26px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;text-align:left;transition:.4s cubic-bezier(.22,1,.36,1);min-height:200px;display:flex;flex-direction:column;justify-content:space-between;font-family:inherit}
.class-card:hover{transform:translateY(-8px);box-shadow:0 28px 70px rgba(0,0,0,.28);border-color:rgba(120,150,255,.28)}
.class-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 55%,rgba(255,255,255,.06));pointer-events:none}
.class-num{font-size:72px;font-weight:1000;line-height:.9;letter-spacing:-4px}
.class-card.c8 .class-num{background:linear-gradient(135deg,#4f7cff,#8a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.class-card.c9 .class-num{background:linear-gradient(135deg,#21d58b,#33d6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.class-card.c10 .class-num{background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
.class-name{font-size:15px;font-weight:950;margin-top:10px;letter-spacing:.3px}
.class-sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.class-card .arrow{position:absolute;right:20px;bottom:20px;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:16px;transition:.4s;border:1px solid rgba(255,255,255,.06)}
.class-card:hover .arrow{background:linear-gradient(135deg,#4f7cff,#8a5cff);transform:translateX(5px);border-color:transparent}
.class-card.c9:hover .arrow{background:linear-gradient(135deg,#21d58b,#33d6ff)}
.class-card.c10:hover .arrow{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.class-card .badge-soon{position:absolute;top:18px;right:18px;font-size:9px;font-weight:900;padding:5px 9px;border-radius:99px;background:rgba(245,158,11,.14);color:#f59e0b;letter-spacing:.5px;border:1px solid rgba(245,158,11,.2)}

/* DETAIL PAGES */
.page{display:none;padding:32px 0 90px;animation:pageIn .45s ease both}.page.active{display:block}@keyframes pageIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.back{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:11px 14px;font-weight:850;cursor:pointer;margin-bottom:14px}.back:hover{transform:translateX(-3px);transition:.3s}
.detail{max-width:850px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:19px;box-shadow:var(--shadow)}
.detail-banner{border-radius:24px;padding:27px;min-height:220px;display:flex;align-items:center;justify-content:space-between;gap:18px;color:#fff;overflow:hidden;position:relative}.detail-banner:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-110px;top:-150px;background:rgba(255,255,255,.1);animation:float 7s infinite alternate}.youtube-banner{background:linear-gradient(135deg,#3b0010,#e30035,#ff5271)}.notes-banner{background:linear-gradient(135deg,#0e245f,#315ee9,#2cb7ff)}.app-banner{background:linear-gradient(135deg,#103c34,#059669,#2dd4bf)}
.detail-banner h2{font-size:37px;line-height:.98;margin:10px 0}.detail-banner p{color:rgba(255,255,255,.8);margin:0}.detail-icon{width:100px;height:100px;border-radius:28px;background:#fff;color:#e0002b;display:grid;place-items:center;font-size:40px;z-index:2;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.info{padding:14px;border:1px solid var(--line);border-radius:16px}.info b{display:block;font-size:13px}.info span{font-size:10px;color:var(--muted)}.detail-text{font-size:13px;line-height:1.8;color:var(--muted)}.download-box{padding:18px;border-radius:20px;background:rgba(33,213,139,.07);border:1px solid rgba(33,213,139,.2);margin-top:15px}.download-box h3{margin:0 0 6px;color:#21d58b}.download-box p{font-size:11px;color:var(--muted);line-height:1.6}.download{position:relative;display:flex;justify-content:center;align-items:center;padding:15px 18px;border-radius:16px;background:linear-gradient(135deg,#16b979,#21d58b,#36e6a0);background-size:200% 200%;color:#fff;font-weight:950;overflow:hidden;box-shadow:0 0 8px rgba(33,213,139,.16),0 8px 22px rgba(33,213,139,.10);transition:.35s;animation:softDownloadGlow 3s ease-in-out infinite;isolation:isolate}.download:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.48) 50%,transparent 75%);transform:translateX(-120%);animation:downloadShine 2.7s ease-in-out infinite}.download:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 0 14px rgba(33,213,139,.24),0 12px 28px rgba(33,213,139,.14);filter:brightness(1.06)}
@keyframes softDownloadGlow{0%,100%{filter:brightness(1);box-shadow:0 0 7px rgba(33,213,139,.14),0 8px 20px rgba(33,213,139,.08)}50%{filter:brightness(1.035);box-shadow:0 0 12px rgba(33,213,139,.22),0 10px 24px rgba(33,213,139,.11)}}
@keyframes downloadShine{0%,45%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}
.footer{padding:30px 0 40px;text-align:center;color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin-top:40px}
.toast{position:fixed;left:50%;bottom:24px;z-index:500;transform:translate(-50%,25px);opacity:0;pointer-events:none;background:#fff;color:#101828;border-radius:14px;padding:12px 16px;font-size:12px;font-weight:850;box-shadow:0 20px 50px rgba(0,0,0,.25);transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes float{to{transform:translate(-25px,20px) scale(1.08)}}
@media(max-width:780px){.hero-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero-main{padding:28px;min-height:360px}.hero h1{font-size:45px}.info-grid{grid-template-columns:1fr 1fr}.toolbar{flex-wrap:wrap}.search{min-width:100%}.filter{height:44px;flex:1}}

.request-card{po
