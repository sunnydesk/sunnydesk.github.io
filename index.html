<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>Sunny Hub — Premium</title>
<style>
:root{
 --bg:#070b18;--panel:#0d1427;--panel2:#121b33;--text:#f8fafc;--muted:#9aa7c2;
 --line:rgba(255,255,255,.09);--blue:#4f7cff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
 background:radial-gradient(circle at 10% 0%,#142657 0,transparent 28%),
            radial-gradient(circle at 100% 20%,#24164d 0,transparent 30%),
            var(--bg);
 color:var(--text);
 font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
 overflow-x:hidden;min-height:100vh;
}
body.light{--bg:#f4f7fb;--panel:#fff;--panel2:#eef3ff;--text:#101828;--muted:#667085;--line:#e4e7ec}
button,input,select{font:inherit}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.container{width:min(1180px,100%);margin:auto;padding:0 18px}

/* ========== INTRO LOADER ========== */
#intro{
 position:fixed;inset:0;z-index:9999;background:#050816;
 display:grid;place-items:center;
 transition:opacity .6s ease,visibility .6s ease;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-logo{text-align:center;animation:pop .8s ease both}
.logo-ring{
 width:100px;height:100px;margin:auto;border-radius:30px;
 display:grid;place-items:center;font-size:46px;font-weight:1000;
 background:linear-gradient(135deg,#4f7cff,#8a5cff);
 box-shadow:0 25px 80px rgba(79,124,255,.45);
}
.intro-logo h1{font-size:32px;letter-spacing:5px;margin:22px 0 4px;font-weight:1000}
.intro-logo p{color:#8290b1;font-size:11px;letter-spacing:3px;font-weight:800}
.loader-line{width:180px;height:3px;background:#18223b;border-radius:99px;margin:26px auto 0;overflow:hidden}
.loader-line i{display:block;width:45%;height:100%;background:linear-gradient(90deg,#4f7cff,#33d6ff);border-radius:99px;animation:load 1.4s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(400%)}}

/* ========== HEADER ========== */
header{
 position:sticky;top:0;z-index:100;
 background:rgba(7,11,24,.75);backdrop-filter:blur(20px);
 border-bottom:1px solid var(--line);
}
.light header{background:rgba(255,255,255,.8)}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:1000;letter-spacing:1px}
.brand-logo{
 width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
 background:linear-gradient(135deg,#4f7cff,#8a5cff);
 box-shadow:0 9px 25px rgba(79,124,255,.28);
 transition:transform .3s ease;
}
.brand:hover .brand-logo{transform:rotate(-7deg) scale(1.06)}
.brand small{display:block;font-size:8px;letter-spacing:2px;color:var(--muted);margin-top:2px;font-weight:700}
.nav-actions{display:flex;gap:8px}
.round{
 width:42px;height:42px;border:1px solid var(--line);background:var(--panel);
 color:var(--text);border-radius:13px;cursor:pointer;transition:.25s;
 display:grid;place-items:center;font-size:16px;
}
.round:hover{transform:translateY(-2px);border-color:rgba(79,124,255,.5)}

/* ========== DRAWER ========== */
.scrim{
 position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:180;
 opacity:0;visibility:hidden;transition:.3s;
}
.scrim.show{opacity:1;visibility:visible}
.drawer{
 position:fixed;z-index:200;left:0;top:0;bottom:0;
 width:min(340px,85vw);
 background:linear-gradient(180deg,#0b1122,#080d19);
 border-right:1px solid rgba(255,255,255,.08);
 transform:translateX(-105%);
 transition:transform .4s cubic-bezier(.16,1,.3,1);
 padding:22px;overflow-y:auto;
}
.drawer.show{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.drawer-brand{font-weight:1000;font-size:19px}
.drawer-brand span{color:#668cff}
.drawer a,.drawer button{
 display:flex;width:100%;align-items:center;gap:13px;
 padding:14px;border:0;border-radius:14px;background:transparent;
 color:#dce5ff;text-align:left;cursor:pointer;margin:3px 0;
 font-weight:700;font-size:14px;transition:.2s;
}
.drawer a:hover,.drawer button:hover{background:rgba(255,255,255,.06)}
.drawer .active{background:linear-gradient(90deg,rgba(79,124,255,.2),transparent);color:#fff}

/* ========== HERO ========== */
.hero{padding:40px 0 18px}
.hero-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
.hero-main{
 min-height:340px;border:1px solid rgba(255,255,255,.09);
 border-radius:32px;padding:36px;position:relative;overflow:hidden;
 background:linear-gradient(135deg,#101e48 0%,#274cc2 52%,#6b45d9 100%);
 box-shadow:0 24px 70px rgba(0,0,0,.35);
}
.hero-main:before{
 content:"";position:absolute;width:320px;height:320px;border-radius:50%;
 right:-90px;top:-130px;background:rgba(255,255,255,.1);
 animation:float 8s ease-in-out infinite alternate;
}
@keyframes float{to{transform:translate(-25px,20px) scale(1.08)}}
.eyebrow{
 display:inline-flex;gap:8px;align-items:center;padding:7px 11px;
 border-radius:99px;background:rgba(255,255,255,.1);
 font-size:10px;font-weight:900;letter-spacing:1.5px;
 position:relative;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.15)}
.hero h1{
 font-size:clamp(36px,5.5vw,62px);line-height:.98;letter-spacing:-2px;
 margin:20px 0 16px;position:relative;
}
.hero p{color:rgba(255,255,255,.8);line-height:1.7;max-width:560px;font-size:15px;position:relative}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;position:relative}
.btn{
 padding:13px 17px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
 font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
 gap:8px;transition:.25s;font-size:14px;
}
.btn.primary{background:#fff;color:#14265f}
.btn.glass{background:rgba(255,255,255,.1);color:#fff}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.15)}
.hero-side{
 border:1px solid var(--line);border-radius:32px;background:var(--panel);
 padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35);
}
.profile{display:flex;gap:13px;align-items:center}
.avatar{
 width:54px;height:54px;border-radius:17px;display:grid;place-items:center;
 background:linear-gradient(135deg,#4f7cff,#8a5cff);font-size:24px;font-weight:1000;
}
.profile b{font-size:16px}
.profile span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:20px}
.mini{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--panel2)}
.mini b{font-size:20px}
.mini span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.quote{
 margin-top:10px;padding:14px;border-radius:16px;
 background:linear-gradient(135deg,rgba(79,124,255,.12),rgba(138,92,255,.08));
 font-size:12px;color:var(--muted);line-height:1.6;
}

/* ========== TABS ========== */
.tabs{
 display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
 margin:22px 0;position:sticky;top:70px;z-index:40;
 padding:6px;background:rgba(7,11,24,.7);backdrop-filter:blur(18px);
 border-radius:18px;
}
.light .tabs{background:rgba(244,247,251,.75)}
.tab{
 padding:13px 8px;border-radius:14px;border:1px solid var(--line);
 background:var(--panel);color:var(--text);font-weight:900;cursor:pointer;
 transition:.25s;font-size:13px;
}
.tab.active{
 background:linear-gradient(135deg,#4f7cff,#5c55e8);color:#fff;
 border-color:transparent;box-shadow:0 12px 30px rgba(79,124,255,.25);
}

/* ========== SECTIONS ========== */
.category-section{display:none}
.category-section.active{display:block;animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.section-head{margin:24px 0 14px}
.section-head h2{margin:0;font-size:22px}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}

/* ========== CARDS ========== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.card{
 background:var(--panel);border:1px solid var(--line);border-radius:24px;
 padding:17px;box-shadow:0 15px 45px rgba(0,0,0,.12);transition:.3s;
}
.card:hover{transform:translateY(-6px);box-shadow:0 25px 60px rgba(0,0,0,.22);border-color:rgba(120,150,255,.22)}
.card-top{display:flex;align-items:center;gap:12px}
.app-icon{
 width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
 font-size:25px;font-weight:1000;flex-shrink:0;
 transition:.3s;
}
.card:hover .app-icon{transform:rotate(-4deg) scale(1.06)}
.blue{background:linear-gradient(135deg,#2f6fff,#564de8)}
.red{background:linear-gradient(135deg,#ff1744,#b90031)}
.green{background:linear-gradient(135deg,#10b981,#047857)}
.orange{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.card h3{margin:0;font-size:15px;line-height:1.3}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
.preview{
 height:160px;margin:14px 0;border-radius:18px;padding:20px;
 display:flex;align-items:center;justify-content:space-between;
 overflow:hidden;position:relative;color:#fff;
}
.pblue{background:linear-gradient(135deg,#12255d,#315ee9,#32b6ff)}
.pred{background:linear-gradient(135deg,#47000f,#e30035,#ff5271)}
.pgreen{background:linear-gradient(135deg,#064e3b,#059669,#2dd4bf)}
.porange{background:linear-gradient(135deg,#6b2d00,#e85d04,#ffb703)}
.preview .small{font-size:9px;font-weight:900;letter-spacing:1.3px;opacity:.8}
.preview .big{font-size:24px;font-weight:1000;line-height:1.05;margin-top:6px}
.play{
 width:80px;height:58px;border-radius:17px;background:#fff;color:#e0002b;
 display:grid;place-items:center;font-size:22px;flex-shrink:0;
 box-shadow:0 14px 35px rgba(0,0,0,.15);
}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.tag{
 font-size:10px;font-weight:900;padding:5px 9px;border-radius:99px;
 background:var(--panel2);color:#6b7bb5;
}
.tag.ok{background:rgba(33,213,139,.12);color:#22d391}
.desc{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:13px}
.actions{display:grid;grid-template-columns:1fr;gap:8px}
.action{
 border:1px solid var(--line);background:var(--panel);color:var(--text);
 border-radius:13px;padding:12px;font-weight:850;text-align:center;
 cursor:pointer;transition:.25s;font-size:13px;
}
.action:hover{transform:translateY(-2px)}
.action.primary{
 position:relative;overflow:hidden;
 background:linear-gradient(135deg,#16b979,#21d58b,#36e6a0);
 background-size:200% 200%;border:0;color:#fff;
 animation:softGlow 3s ease-in-out infinite;
}
.action.primary:hover{transform:translateY(-3px) scale(1.01);filter:brightness(1.06)}
@keyframes softGlow{
 0%,100%{box-shadow:0 0 7px rgba(33,213,139,.14),0 8px 20px rgba(33,213,139,.08)}
 50%{box-shadow:0 0 12px rgba(33,213,139,.22),0 10px 24px rgba(33,213,139,.11)}
}

/* ========== CLASS SELECTION ========== */
.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.class-card{
 position:relative;overflow:hidden;padding:24px 22px;
 border-radius:24px;border:1px solid var(--line);background:var(--panel);
 color:var(--text);cursor:pointer;text-align:left;
 transition:.4s cubic-bezier(.22,1,.36,1);min-height:190px;
 display:flex;flex-direction:column;justify-content:space-between;
 font-family:inherit;
}
.class-card:hover{transform:translateY(-8px);box-shadow:0 28px 70px rgba(0,0,0,.28);border-color:rgba(120,150,255,.28)}
.class-num{font-size:68px;font-weight:1000;line-height:.9;letter-spacing:-4px}
.class-card.c8 .class-num{background:linear-gradient(135deg,#4f7cff,#8a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.class-card.c9 .class-num{background:linear-gradient(135deg,#21d58b,#33d6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.class-card.c10 .class-num{background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
.class-name{font-size:15px;font-weight:950;margin-top:8px}
.class-sub{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.class-card .arrow{
 position:absolute;right:20px;bottom:20px;width:38px;height:38px;
 border-radius:13px;display:grid;place-items:center;
 background:rgba(255,255,255,.06);font-size:16px;
 transition:.4s;border:1px solid rgba(255,255,255,.06);
}
.class-card:hover .arrow{background:linear-gradient(135deg,#4f7cff,#8a5cff);transform:translateX(5px);border-color:transparent}
.class-card.c9:hover .arrow{background:linear-gradient(135deg,#21d58b,#33d6ff)}
.class-card.c10:hover .arrow{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.badge-soon{
 position:absolute;top:16px;right:16px;font-size:9px;font-weight:900;
 padding:5px 9px;border-radius:99px;
 background:rgba(245,158,11,.14);color:#f59e0b;
 border:1px solid rgba(245,158,11,.2);
}

/* ========== DETAIL PAGES ========== */
.page{display:none;padding:28px 0 80px}
.page.active{display:block;animation:fadeIn .4s ease both}
.back{
 border:1px solid var(--line);background:var(--panel);color:var(--text);
 border-radius:13px;padding:11px 14px;font-weight:850;cursor:pointer;
 margin-bottom:14px;font-size:13px;
}
.back:hover{transform:translateX(-3px);transition:.3s}
.detail{
 max-width:850px;margin:auto;background:var(--panel);
 border:1px solid var(--line);border-radius:28px;padding:18px;
 box-shadow:0 24px 70px rgba(0,0,0,.3);
}
.detail-banner{
 border-radius:22px;padding:26px;min-height:200px;
 display:flex;align-items:center;justify-content:space-between;
 gap:18px;color:#fff;overflow:hidden;position:relative;
}
.detail-banner:after{
 content:"";position:absolute;width:280px;height:280px;border-radius:50%;
 right:-110px;top:-150px;background:rgba(255,255,255,.1);
}
.youtube-banner{background:linear-gradient(135deg,#3b0010,#e30035,#ff5271)}
.notes-banner{background:linear-gradient(135deg,#0e245f,#315ee9,#2cb7ff)}
.app-banner{background:linear-gradient(135deg,#103c34,#059669,#2dd4bf)}
.detail-banner h2{font-size:34px;line-height:1;margin:10px 0;position:relative}
.detail-banner p{color:rgba(255,255,255,.85);font-size:13px;position:relative}
.detail-icon{
 width:96px;height:96px;border-radius:26px;background:#fff;
 display:grid;place-items:center;font-size:38px;flex-shrink:0;
 box-shadow:0 18px 50px rgba(0,0,0,.18);position:relative;
}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.info{padding:14px;border:1px solid var(--line);border-radius:15px}
.info b{display:block;font-size:13px}
.info span{font-size:10px;color:var(--muted)}
.detail-text{font-size:13px;line-height:1.8;color:var(--muted)}
.download-box{
 padding:18px;border-radius:18px;background:rgba(33,213,139,.07);
 border:1px solid rgba(33,213,139,.2);margin-top:15px;
}
.download-box h3{margin:0 0 6px;color:#21d58b;font-size:15px}
.download-box p{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.download{
 display:flex;justify-content:center;align-items:center;
 padding:15px 18px;border-radius:15px;
 background:linear-gradient(135deg,#16b979,#21d58b,#36e6a0);
 background-size:200% 200%;
 color:#fff;font-weight:950;font-size:14px;
 transition:.3s;animation:softGlow 3s ease-in-out infinite;
}
.download:hover{transform:translateY(-3px) scale(1.01);filter:brightness(1.06)}
.footer{
 padding:30px 0 40px;text-align:center;color:var(--muted);
 font-size:11px;border-top:1px solid var(--line);margin-top:40px;
}
.toast{
 position:fixed;left:50%;bottom:24px;z-index:500;
 transform:translate(-50%,25px);opacity:0;pointer-events:none;
 background:#fff;color:#101828;border-radius:14px;padding:12px 18px;
 font-size:13px;font-weight:850;
 box-shadow:0 20px 50px rgba(0,0,0,.3);transition:.3s;
 max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ========== REQUEST CENTER ========== */
.request-section{padding:40px 0 8px}
.request-card{
 position:relative;overflow:hidden;display:flex;
 align-items:center;justify-content:space-between;
 padding:32px 34px;border:1px solid rgba(255,255,255,.1);
 border-radius:28px;
 background:radial-gradient(circle at 90% 15%,rgba(51,214,255,.14),transparent 28%),
            radial-gradient(circle at 10% 100%,rgba(138,92,255,.15),transparent 35%),
            linear-gradient(135deg,#0e1832,#111d3c 55%,#151d39);
 box-shadow:0 25px 80px rgba(0,0,0,.24);
}
.request-content{position:relative;z-index:2;max-width:660px}
.request-badge{
 display:inline-flex;padding:7px 11px;border-radius:99px;
 background:rgba(79,124,255,.12);border:1px solid rgba(79,124,255,.2);
 color:#9bb5ff;font-size:10px;font-weight:950;letter-spacing:1.5px;
}
.request-content h2{font-size:clamp(26px,4vw,40px);letter-spacing:-1.5px;margin:14px 0 8px}
.request-content p{color:var(--muted);line-height:1.75;font-size:13px;margin-bottom:20px;max-width:580px}
.request-btn{
 display:flex;align-items:center;gap:13px;width:min(380px,100%);
 padding:14px 16px;border-radius:16px;color:#fff;
 background:linear-gradient(135deg,#138f68,#21d58b,#2de5a0);
 box-shadow:0 12px 30px rgba(33,213,139,.16);transition:.35s;
}
.request-btn:hover{transform:translateY(-4px);filter:brightness(1.05);box-shadow:0 18px 40px rgba(33,213,139,.28)}
.request-icon{
 width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
 background:rgba(255,255,255,.16);font-size:18px;
}
.request-btn b{display:block;font-size:13px}
.request-btn small{display:block;font-size:10px;opacity:.8;margin-top:2px}
.request-arrow{margin-left:auto;font-size:20px;font-weight:900}
.request-orb{
 position:absolute;right:40px;bottom:-60px;width:200px;height:200px;
 border-radius:50%;display:grid;place-items:center;font-size:90px;
 font-weight:1000;color:rgba(255,255,255,.09);
 border:1px solid rgba(255,255,255,.06);
}
.light .request-card{background:linear-gradient(135deg,#fff,#f0f5ff);border-color:#e2e8f5}
.light .request-content p{color:#667085}

/* ========== RESPONSIVE ========== */
@media(max-width:780px){
 .hero-grid{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .hero-main{padding:26px;min-height:320px}
 .hero h1{font-size:40px}
 .info-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .class-grid{grid-template-columns:1fr}
 .class-card{min-height:auto;padding:22px 20px}
 .class-num{font-size:56px}
 .request-card{padding:26px 22px}
 .request-orb{right:-40px;bottom:-65px;width:160px;height:160px;font-size:70px}
}
@media(max-width:440px){
 .container{padding:0 12px}
 .nav{height:64px}
 .brand small{font-size:7px}
 .tab{font-size:11px;padding:11px 5px}
 .detail-banner{min-height:220px;flex-direction:column;align-items:flex-start}
 .detail-icon{width:72px;height:72px;font-size:28px}
 .detail-banner h2{font-size:28px}
 .info-grid{grid-template-columns:1fr 1fr}
 .tabs{top:64px}
}
@media(prefers-reduced-motion:reduce){
 *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* Scroll progress bar */
.scroll-progress{
 position:fixed;left:0;top:0;height:3px;width:0;z-index:10000;
 background:linear-gradient(90deg,#4f7cff,#33d6ff,#8a5cff);
 transition:width .1s linear;
}
</style>
</head>
<body>

<!-- SCROLL PROGRESS -->
<div class="scroll-progress" id="scrollProgress"></div>

<!-- INTRO LOADER -->
<div id="intro">
 <div class="intro-logo">
  <div class="logo-ring">S</div>
  <h1>SUNNY</h1>
  <p>NOTES • APPS • LINKS</p>
  <div class="loader-line"><i></i></div>
 </div>
</div>

<!-- DRAWER -->
<div class="scrim" id="scrim" onclick="closeMenu()"></div>
<aside class="drawer" id="drawer">
 <div class="drawer-head">
  <div class="drawer-brand"><span>S</span> SUNNY HUB</div>
  <button class="round" onclick="closeMenu()">✕</button>
 </div>
 <button class="active" onclick="showHome();closeMenu()">⌂ <span>Home</span></button>
